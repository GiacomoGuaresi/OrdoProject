[workspace]
resolver = "2"
members = ["crates/ordo-core", "crates/ordo-cli", "app/src-tauri"]

[workspace.package]
version = "2.0.0-alpha.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/GiacomoGuaresi/OrdoProject"
authors = ["Giacomo Guaresi"]
rust-version = "1.90"

[workspace.dependencies]
ordo-core = { path = "crates/ordo-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
