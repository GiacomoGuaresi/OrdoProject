[package]
name = "ordo-core"
description = "Core logic for Ordo: rules, matching, moves, history and undo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
blake3 = "1.8.7"
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
globset = "0.4.21"
regex = "1.13.1"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sys-locale = "0.3.2"
thiserror.workspace = true
trash = "5.3.0"
ts-rs = { version = "12.0.1", features = ["chrono-impl", "uuid-impl", "serde-json-impl"], optional = true }
uuid = { version = "1.29.2", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"

[features]
ts-rs = ["dep:ts-rs"]
